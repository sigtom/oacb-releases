version: 1
branch_model: dev-main
integration_branch: dev
stable_branch: main
ci_runner_policy: self-hosted-only
production_mutation: explicit-approval
work_branch_prefixes:
  - codex/
  - feat/
  - feature/
  - fix/
required_files:
  - AGENTS.md
  - README.md
  - docs/development.md
  - docs/security.md
  - docs/repo-contract.schema.json
  - scripts/check_repository_contract.py
  - .github/workflows/repository-contract.yml
  - .github/workflows/repository-contract-reusable.yml
  - .github/workflows/branch-flow.yml
  - .github/workflows/gitleaks.yml
