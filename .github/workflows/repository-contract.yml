name: repository-contract

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".repo-contract.yml"
      - "AGENTS.md"
      - "README.md"
      - "docs/development.md"
      - "docs/security.md"
      - "docs/repo-contract.schema.json"
      - "scripts/check_repository_contract.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    uses: ./.github/workflows/repository-contract-reusable.yml
