name: repository-contract-reusable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate repository-first contract
        run: python3 scripts/check_repository_contract.py
